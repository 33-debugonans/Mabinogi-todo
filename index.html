<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#55745b" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="마비노기 숙제" />
<title>마비노기 숙제 체크리스트</title>
<style>
:root{
 --ink:#413550;--muted:#91869e;--purple:#b69ad9;--lav:#eee4ff;--pink:#ffdbe8;
 --pink2:#fff0f6;--mint:#dff5ea;--cream:#fff3d2;--paper:#fffdfd;--line:#d8cbe3;
 --shadow:0 7px 0 rgba(121,94,150,.06),0 12px 30px rgba(99,73,125,.10)
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(145deg,#fff4fa,#f5efff 50%,#f8fff9);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
.app{width:min(900px,calc(100% - 20px));margin:14px auto 40px;background:#fffafd;border:2px solid #9d8caf;border-radius:22px;box-shadow:0 18px 45px rgba(83,61,106,.15);overflow:hidden}
.windowbar{height:54px;display:flex;align-items:center;gap:9px;padding:0 16px;background:linear-gradient(90deg,#f4dff2,#e9e0ff);border-bottom:2px solid #9d8caf;position:relative}
.traffic{display:flex;gap:7px}.dot{width:16px;height:16px;border-radius:50%;border:1.5px solid #7c6b86;box-shadow:inset 0 1px 2px #fff}
.red{background:#f28c98}.yellow{background:#f3d66d}.green{background:#79d0a7}
.window-title{font-size:13px;font-weight:900;letter-spacing:.09em;margin-left:7px;flex:1}.window-x{width:34px;height:34px;display:grid;place-items:center;border:2px solid #a697b8;border-radius:9px;background:#faf7ff;color:#87769b;font-size:21px;font-weight:800}
.hero{position:relative;padding:24px 22px 20px;background:linear-gradient(135deg,#fbf0ff 0%,#fff4f8 54%,#effaf4 100%);border-bottom:1px solid #e9ddec;overflow:hidden}
.hero:after{content:"☁️  ✦  🌳";position:absolute;right:20px;bottom:10px;font-size:25px;opacity:.7;letter-spacing:8px}
.hero h1{margin:0;font-size:29px;position:relative;z-index:1}.hero h1:before{content:"🐱";font-size:32px;margin-right:9px}.hero p{margin:7px 0 0;color:var(--muted);font-size:13px;position:relative;z-index:1}
.tabs{display:flex;gap:9px;padding:14px 18px;background:#fff;overflow-x:auto;border-bottom:1px solid #eadfed}.tabs button{flex:0 0 auto}
button,input{font:inherit} button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;color:var(--ink);cursor:pointer;box-shadow:0 2px 0 rgba(112,88,135,.06)}
button.primary{background:#d8c3f4;border-color:#bda5db;font-weight:800}button.danger{color:#b65e78}button.small{padding:5px 8px;border-radius:9px;font-size:12px}
.tab{min-width:86px}.tab:before{content:"🐾";margin-right:5px}.tab.active{background:#d9c5f5;border-color:#b69ad9;font-weight:900}
.char-title{display:flex;gap:8px;align-items:center;padding:15px 18px 10px;background:#fffafd}.char-title strong{font-size:18px}.char-title strong:before{content:"🎮 ";font-size:17px}
.history{margin:0 18px 14px;padding:14px 15px;background:linear-gradient(135deg,#fff4d5,#fff9e9);border:1.5px solid #e7d59d;border-radius:16px;font-size:13px;box-shadow:0 4px 12px rgba(153,120,51,.06);position:relative}
.history:after{content:"🐈 ✨";position:absolute;right:14px;bottom:10px;font-size:18px;opacity:.72}.history b{display:block;margin-bottom:7px;font-size:15px}.empty{color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 18px 18px}
.card{border:1.5px solid var(--line);border-radius:19px;padding:16px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.card:first-child{background:linear-gradient(180deg,#f8f2ff,#fffafd)}.card:nth-child(2){background:linear-gradient(180deg,#eefaf5,#fffdfb)}
.card h2{font-size:20px;margin:0 0 4px;display:flex;align-items:center;gap:6px}.card h2:after{content:"✦";font-size:13px;color:#e2a1bd;margin-left:auto}.sub{color:var(--muted);font-size:12px;margin-bottom:10px}
.progress{height:12px;background:#eee8f1;border:1px solid #d9cee0;border-radius:99px;overflow:hidden;margin:8px 0 15px}.progress>div{height:100%;background:linear-gradient(90deg,#f18dac,#f5bad0);transition:.2s}.card:nth-child(2) .progress>div{background:linear-gradient(90deg,#80cdaa,#b4e7d0)}
.task{display:flex;align-items:flex-start;gap:9px;padding:10px;margin:7px 0;border:1.5px solid #e6dbe9;border-radius:13px;background:rgba(255,255,255,.92);transition:.15s}.task:hover{transform:translateY(-1px)}
.task input[type=checkbox]{appearance:none;width:22px;height:22px;min-width:22px;margin:0;border:2px solid #a99eb0;border-radius:6px;background:#fff;display:grid;place-items:center}.task input[type=checkbox]:checked{background:#ee8fb1;border-color:#dc779d}.task input[type=checkbox]:checked:after{content:"✓";color:#fff;font-weight:900;font-size:15px}
.task .txt{flex:1;white-space:pre-line;line-height:1.45}.task.done{background:#fff0f6;border-color:#efc5d5}.task.done .txt{text-decoration:line-through;color:#9b8fa3}.mini-actions{display:flex;gap:4px;opacity:.65}
.section{margin:8px 0;padding:12px;border-radius:14px;background:#fff;border:1.5px solid #dfd4e6;scroll-margin-top:68px;box-shadow:0 3px 10px rgba(91,67,112,.04)}
.section-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:9px}.section-title{font-weight:900}.section-title:before{content:"⚔️";margin-right:6px;font-size:15px}.pill{font-size:11px;padding:4px 8px;border-radius:999px;background:#eadcff;color:#665276;font-weight:700}
.group-main{display:flex;align-items:center;gap:6px;flex-wrap:wrap;cursor:pointer;min-width:0}.selected-summary{font-size:12px;color:#765f83;font-weight:800;padding:3px 8px;background:#fff;border:1px solid #e5d7ea;border-radius:8px;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.group-toggle{border:0;background:transparent;padding:2px 4px;min-height:auto;box-shadow:none;color:#8d7c9a}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.option{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid #e5dce9;padding:9px;border-radius:11px}.option input{accent-color:#ea82a7;width:18px;height:18px}.option:has(input:checked){background:#fff0f6;border-color:#eeb7cc}
.section.completed{padding:10px 12px;background:linear-gradient(90deg,#eaf8f1,#fff1f6);border-color:#c5dfd1}.section.completed .options{display:none}.section.completed .section-head{margin-bottom:0}.section.completed .pill{background:#cfeedd;color:#47745f}
.footer-note{text-align:center;color:#a195aa;font-size:11px;padding:0 18px 20px}.footer-note:after{content:"  ♡"}
.modal{position:fixed;inset:0;background:rgba(69,51,84,.28);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}
.dialog{width:min(520px,100%);background:#fffafd;border:2px solid #9d8caf;border-radius:18px;padding:0 18px 18px;box-shadow:0 20px 50px rgba(75,54,94,.25);overflow:hidden}
.dialog:before{content:"🔴  🟡  🟢    EDIT_TASK.EXE";display:block;margin:0 -18px 16px;padding:12px 14px;background:linear-gradient(90deg,#f4dff2,#e9e0ff);border-bottom:2px solid #a697b8;font-size:12px;font-weight:900;letter-spacing:.04em}.dialog h3{margin-top:0}
.dialog input,.dialog textarea,.dialog select{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:10px;margin:6px 0 12px;background:#fff;font:inherit}.dialog textarea{min-height:110px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.right{justify-content:flex-end}.note{font-size:12px;color:var(--muted);line-height:1.5}
@media(max-width:720px){.app{width:100%;margin:0;border-left:0;border-right:0;border-radius:0}.windowbar{position:sticky;top:0;z-index:10}.grid{grid-template-columns:1fr;padding-left:10px;padding-right:10px}.hero{padding-left:14px}.hero h1{font-size:25px}.hero:after{font-size:20px;opacity:.45}.tabs{padding-left:10px}.char-title{padding-left:10px;padding-right:10px;flex-wrap:wrap}.history{margin-left:10px;margin-right:10px}.card{padding:14px}.options{grid-template-columns:1fr}button{min-height:42px}.small{min-height:34px}}
@media(max-width:430px){.window-title{font-size:11px;letter-spacing:.04em}.window-x{width:31px;height:31px}.history:after{display:none}}
</style>
</head>
<body><div class="app">
<div class="windowbar"><div class="traffic"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div><div class="window-title">MABINOGI_TASK.EXE</div><div class="window-x">×</div></div>
<div class="hero"><h1>⚔️ 마비노기 숙제 체크리스트</h1><p>매일 07:00 일일 초기화 · 매주 월요일 07:00 주간 초기화 · 이 브라우저에 자동 저장</p></div>
<div class="tabs" id="tabs"></div>
<div class="char-title"><strong id="charName"></strong><button class="small" onclick="renameChar()">이름 수정</button><button class="small danger" onclick="deleteChar()">캐릭터 삭제</button><button class="primary small" onclick="addChar()">＋ 부캐 추가</button></div>
<div class="history" id="history"></div>
<div class="grid">
<section class="card"><h2>☀️ 일일 숙제</h2><div class="sub" id="dailyCount"></div><div class="progress"><div id="dailyBar"></div></div><div id="daily"></div><button style="margin-top:12px" onclick="addTask('daily')">＋ 일일 할 일 추가</button></section>
<section class="card"><h2>📅 주간 숙제</h2><div class="sub" id="weeklyCount"></div><div class="progress"><div id="weeklyBar"></div></div><div id="weekly"></div><button style="margin-top:12px" onclick="addTask('weekly')">＋ 주간 할 일 추가</button></section>
</div><div class="footer-note">초기화는 페이지를 열었을 때 현재 시각을 확인해 처리됩니다. 기록과 설정은 이 기기의 현재 브라우저에 저장됩니다.</div>
</div>
<div class="modal" id="modal"><div class="dialog"><h3 id="modalTitle"></h3><div id="modalBody"></div><div class="actions right"><button onclick="closeModal()">취소</button><button class="primary" id="modalSave">저장</button></div></div></div>
<script>
const KEY='mabinogi_task_manager_v2';
const dungeonNames=['피오드','룬다','페카 고분','페론 고분','바리 1광구','바리 2광구','마스','라비','키아','알비','남쪽 폐허','북쪽 폐허'];
const huntNames=['창백한 산','센마이 평원','구름 황야','여신의 뜰','늑대의 숲','얼음 협곡'];
const stages=['1-1','1-2','1-3','2-1','2-2','2-3'];
const defaultDaily=[
 t('심층 던전'), group('던전 돌기','dungeon', dungeonNames.flatMap(n=>stages.map(s=>n+' '+s))),
 t('창백한 산'), group('사냥터 돌기','hunt',huntNames), t('요일 던전'),t('아르바이트'),t('검은 구멍 1회 이상'),
 t('제이미\n사과수플레 2 > 상금 옷감 8\n사과생크림케이크 1 > 상급 옷감+ 6'),
 t('제롬 크림소스스테이크 1 > 상급 실크 4'),t('(두갈드아일) 엘빈 - 야채볶음 2개 > 상급 목재 8개')];
const defaultWeekly=[t('필드보스'),t('(콜헨) 킬리안: 깔끔 진액 30개 구매'),t('(이멘마하) 아그네스: 산뜻 버섯 진액 30개 구매'),t('(이멘마하) 도나: 성수 구매'),t('(이멘마하) 델렌:\n가든샐러드 4개 > 특급목재\n호박수프 8개 > 최상급 목재/최상급 가죽'),t('아이데른: 농어매운탕 > 은합금괴'),t('어비스 3종'),t('카브락'),t('에이렐'),t('화이트 서큐버스'),...Array.from({length:7},(_,i)=>t('소환의 결계 '+(i+1)+'회')),t('뱅가드 브리치 3회')];
function id(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function t(text){return {id:id(),type:'task',text,done:false}}
function group(text,key,options){return {id:id(),type:'group',text,key,options,selected:''}}
function cloneDefaults(){return {daily:JSON.parse(JSON.stringify(defaultDaily)),weekly:JSON.parse(JSON.stringify(defaultWeekly)),history:{date:'',dungeon:'',hunt:'',dungeonDate:'',huntDate:''}}}
let data=load(); let current=data.current||data.characters[0].id;
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.characters?.length){x.characters.forEach(c=>{if(!Array.isArray(c.daily)||!c.daily.length)c.daily=JSON.parse(JSON.stringify(defaultDaily));if(!Array.isArray(c.weekly)||!c.weekly.length)c.weekly=JSON.parse(JSON.stringify(defaultWeekly));if(!c.history)c.history={date:'',dungeon:'',hunt:'',dungeonDate:'',huntDate:''};if(c.history.dungeonDate===undefined)c.history.dungeonDate=c.history.dungeon?c.history.date||'':'';if(c.history.huntDate===undefined)c.history.huntDate=c.history.hunt?c.history.date||'':'';});return x}}catch(e){} const c={id:id(),name:'메인 캐릭터',...cloneDefaults()};return {current:c.id,characters:[c],lastDailyBoundary:'',lastWeeklyBoundary:''}}
function save(){data.current=current;localStorage.setItem(KEY,JSON.stringify(data))}
function boundaryDaily(now=new Date()){let d=new Date(now);if(d.getHours()<7)d.setDate(d.getDate()-1);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function boundaryWeekly(now=new Date()){let d=new Date(now);if(d.getHours()<7)d.setDate(d.getDate()-1);let day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return boundaryDaily(new Date(d.getFullYear(),d.getMonth(),d.getDate(),7))}
function resetIfNeeded(){let db=boundaryDaily(),wb=boundaryWeekly();if(data.lastDailyBoundary!==db){data.characters.forEach(c=>{let dg=c.daily.find(x=>x.type==='group'&&x.key==='dungeon');let hu=c.daily.find(x=>x.type==='group'&&x.key==='hunt');if(!c.history)c.history={date:'',dungeon:'',hunt:'',dungeonDate:'',huntDate:''};let playedDate=data.lastDailyBoundary||'';if(dg?.selected){c.history.dungeon=dg.selected;c.history.dungeonDate=playedDate}if(hu?.selected){c.history.hunt=hu.selected;c.history.huntDate=playedDate}c.history.date=playedDate;c.daily.forEach(x=>{if(x.type==='task')x.done=false;else x.selected=''})});data.lastDailyBoundary=db}if(data.lastWeeklyBoundary!==wb){data.characters.forEach(c=>c.weekly.forEach(x=>{if(x.type==='task')x.done=false;else x.selected=''}));data.lastWeeklyBoundary=wb}save()}
function C(){return data.characters.find(c=>c.id===current)||data.characters[0]}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){resetIfNeeded();let c=C();document.getElementById('charName').textContent='👤 '+c.name;document.getElementById('tabs').innerHTML=data.characters.map(x=>`<button class="tab ${x.id===current?'active':''}" onclick="switchChar('${x.id}')">${esc(x.name)}</button>`).join('');renderHistory(c);renderList('daily',c.daily);renderList('weekly',c.weekly)}
function renderHistory(c){let h=c.history||{};let dungeon=h.dungeon?`던전: <strong>${esc(h.dungeon)}</strong>${h.dungeonDate?` <span class="note">(${esc(h.dungeonDate)})</span>`:''}`:'';let hunt=h.hunt?`사냥터: <strong>${esc(h.hunt)}</strong>${h.huntDate?` <span class="note">(${esc(h.huntDate)})</span>`:''}`:'';document.getElementById('history').innerHTML=`<b>🕘 이전 기록</b>${dungeon||hunt?[dungeon,hunt].filter(Boolean).join(' · '):`<span class="empty">아직 저장된 이전 기록이 없어요. 던전이나 사냥터를 선택한 뒤 다음 일일 초기화부터 표시됩니다.</span>`}`}
function renderList(kind,list){let html='';list.forEach(x=>{if(x.type==='task'){html+=`<div class="task ${x.done?'done':''}"><input type="checkbox" ${x.done?'checked':''} onchange="toggle('${kind}','${x.id}',this.checked)"><div class="txt">${esc(x.text)}</div><div class="mini-actions"><button class="small" onclick="editItem('${kind}','${x.id}')">✎</button><button class="small danger" onclick="removeItem('${kind}','${x.id}')">×</button></div></div>`}else{let completed=!!x.selected;html+=`<div class="section ${completed?'completed':''}" id="group_${x.id}"><div class="section-head"><div class="group-main" onclick="toggleGroupOpen('${x.id}')"><span class="section-title">${esc(x.text)}</span> <span class="pill">${completed?'✓ 완료':'1개 선택 시 완료'}</span>${completed?`<span class="selected-summary">${esc(x.selected)}</span>`:''}<button class="group-toggle" type="button">${completed?'▾':'▴'}</button></div><div class="mini-actions"><button class="small" onclick="event.stopPropagation();editGroup('${kind}','${x.id}')">✎</button><button class="small danger" onclick="event.stopPropagation();removeItem('${kind}','${x.id}')">×</button></div></div><div class="options">${x.options.map(o=>`<label class="option"><input type="radio" name="${current}_${x.id}" ${x.selected===o?'checked':''} onchange="selectGroup('${kind}','${x.id}',${JSON.stringify(o).replace(/"/g,'&quot;')})"><span>${esc(o)}</span></label>`).join('')}</div></div>`}});document.getElementById(kind).innerHTML=html;let done=list.filter(x=>x.type==='task'?x.done:!!x.selected).length,total=list.length,p=total?Math.round(done/total*100):0;document.getElementById(kind+'Count').textContent=`${done} / ${total} 완료 (${p}%)`;document.getElementById(kind+'Bar').style.width=p+'%'}
function toggle(kind,itemId,val){let x=C()[kind].find(x=>x.id===itemId);x.done=val;save();render()}
function selectGroup(kind,itemId,val){let x=C()[kind].find(x=>x.id===itemId);x.selected=val;save();render();requestAnimationFrame(()=>requestAnimationFrame(()=>{let el=document.getElementById('group_'+itemId);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}))}
function toggleGroupOpen(itemId){let el=document.getElementById('group_'+itemId);if(!el)return;el.classList.toggle('completed');let b=el.querySelector('.group-toggle');if(b)b.textContent=el.classList.contains('completed')?'▾':'▴'}
function switchChar(cid){current=cid;save();render()}
function modal(title,body,onSave){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalSave').onclick=onSave;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function addTask(kind){modal((kind==='daily'?'일일':'주간')+' 할 일 추가',`<label>내용</label><textarea id="editText" placeholder="할 일을 입력하세요"></textarea>`,()=>{let v=document.getElementById('editText').value.trim();if(!v)return;C()[kind].push(t(v));save();closeModal();render()})}
function editItem(kind,itemId){let x=C()[kind].find(x=>x.id===itemId);modal('할 일 수정',`<label>내용</label><textarea id="editText">${esc(x.text)}</textarea>`,()=>{let v=document.getElementById('editText').value.trim();if(!v)return;x.text=v;save();closeModal();render()})}
function editGroup(kind,itemId){let x=C()[kind].find(x=>x.id===itemId);modal('선택형 숙제 수정',`<label>숙제 이름</label><input id="gname" value="${esc(x.text)}"><label>선택지 (한 줄에 하나)</label><textarea id="gopts">${esc(x.options.join('\n'))}</textarea><div class="note">선택지 중 하나만 골라도 이 숙제는 완료 처리됩니다.</div>`,()=>{let n=document.getElementById('gname').value.trim(),opts=document.getElementById('gopts').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!n||!opts.length)return;x.text=n;x.options=opts;if(!opts.includes(x.selected))x.selected='';save();closeModal();render()})}
function removeItem(kind,itemId){if(!confirm('이 항목을 삭제할까요?'))return;C()[kind]=C()[kind].filter(x=>x.id!==itemId);save();render()}
function addChar(){modal('부캐 추가',`<label>캐릭터 이름</label><input id="cname" placeholder="예: 부캐 1"><div class="note">새 캐릭터에는 현재 기본 구성과 동일한 일일/주간 숙제 페이지가 생성됩니다.</div>`,()=>{let n=document.getElementById('cname').value.trim();if(!n)return;let c={id:id(),name:n,...cloneDefaults()};data.characters.push(c);current=c.id;save();closeModal();render()})}
function renameChar(){let c=C();modal('캐릭터 이름 수정',`<label>이름</label><input id="cname" value="${esc(c.name)}">`,()=>{let n=document.getElementById('cname').value.trim();if(!n)return;c.name=n;save();closeModal();render()})}
function deleteChar(){if(data.characters.length===1){alert('캐릭터는 최소 1명 필요해요.');return}if(!confirm(C().name+' 캐릭터와 체크 기록을 삭제할까요?'))return;data.characters=data.characters.filter(x=>x.id!==current);current=data.characters[0].id;save();render()}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
render();setInterval(()=>{let d=data.lastDailyBoundary,w=data.lastWeeklyBoundary;if(d!==boundaryDaily()||w!==boundaryWeekly())render()},60000);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(console.error));
}
</script></body></html>
